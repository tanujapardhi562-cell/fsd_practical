
<!DOCTYPE html>
<html>
<head><title>Update Student</title></head>
<body>
    <h1>Update Student Course</h1>
    <form action="/update" method="POST">
        <label>Student ID:</label>
        <input type="number" name="Student_ID" required><br><br>
        <label>New Course:</label>
        <input type="text" name="New_Course" required><br><br>
        <button type="submit">Update Course</button>
    </form>
    <h2>Student List</h2>
    <table border="1" cellpadding="8"><tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Course</th></tr>
        {% for student in students %}<tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td></tr>
        {% endfor %}
    </table>
    <a href="/">Add Student</a>
</body>
</html>
